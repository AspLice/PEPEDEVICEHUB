name: Dependency audit
on:
  pull_request:
  push:
    branches: [develop, 'feature/**']
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-audit --locked --version 0.22.0 --no-default-features
      - run: cargo audit
